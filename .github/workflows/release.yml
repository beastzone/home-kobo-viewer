name: Release

# Every push to main builds every package and publishes them as the GitHub
# release for the version in Cargo.toml (v0.5.0, ...): raise that version for a
# new release; otherwise the existing release's files are refreshed.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "phone-panel/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kobo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      # Zig for cargo-zigbuild, checksum-verified (mlugg/setup-zig still runs on Node 20)
      - name: Install Zig
        run: |
          curl -sSfL https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - run: cargo install cargo-zigbuild --locked
      - run: cargo test --locked
      - run: cargo zigbuild --locked --release --target armv7-unknown-linux-musleabihf
      - uses: actions/upload-artifact@v7
        with:
          name: kobo-binary
          path: target/armv7-unknown-linux-musleabihf/release/kobo-ha-dashboard

  desktop:
    needs: kobo
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x64, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: kobo-binary
          path: kobo-binary
      - name: Package
        shell: bash
        run: |
          VERSION="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          PKG="kobo-ha-dashboard-$VERSION-${{ matrix.name }}"
          mkdir -p "$PKG/kobo"
          cp "target/${{ matrix.target }}/release/kobo-ha-dashboard${{ matrix.exe }}" "$PKG/"
          cp kobo-binary/kobo-ha-dashboard "$PKG/kobo/kobo-ha-dashboard"
          cp README.md LICENSE LICENSE.kobo-ha-dashboard config.example.yaml "$PKG/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$PKG.zip" "$PKG" > /dev/null
          else
            chmod +x "$PKG/kobo-ha-dashboard" "$PKG/kobo/kobo-ha-dashboard"
            zip -qr "$PKG.zip" "$PKG"
          fi
          echo "PKG_ZIP=$PKG.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.PKG_ZIP }}

  publish:
    needs: desktop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*-x64"
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Home Kobo Viewer ${{ steps.version.outputs.tag }}
          files: dist/*.zip
          make_latest: true
          generate_release_notes: true
